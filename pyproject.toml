[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simclr-dino"
version = "0.1.0"
description = "Self-supervised vision from scratch in PyTorch: SimCLR vs. DINO on CIFAR-10 with a shared Tiny ViT backbone."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "pyyaml>=6.0",
    "matplotlib>=3.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/simclr_dino"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
